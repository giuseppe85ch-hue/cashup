name: CASHUP native app validation
on:
  push:
    branches: [cashup-native-steps]
  pull_request:
    branches: [main]
    paths:
      - "App.js"
      - "app.json"
      - "index.js"
      - "package.json"
      - "index.html"
      - "NATIVE_STEPS.md"
jobs:
  expo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor
