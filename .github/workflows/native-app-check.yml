name: CASHUP native app validation
concurrency:
  group: cashup-validation-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, cashup-native-steps]
  pull_request:
    branches: [main]
    paths:
      - "App.js"
      - "app.json"
      - "index.js"
      - "package.json"
      - "index.html"
      - "NATIVE_STEPS.md"
      - "games/**"
      - "scripts/**"
      - "sw.js"
      - "globalization.js"
      - ".github/workflows/native-app-check.yml"
jobs:
  expo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate CASHUP Games catalog
        run: node scripts/validate-games.mjs
      - name: Check CASHUP mini-game JavaScript syntax
        run: node --check games/arcade.js
      - name: Check CASHUP cloud progress module syntax
        run: node --input-type=module --check < games/cloud-progress.js
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor

  android-debug:
    needs: expo-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install dependencies
        run: npm install
      - name: Install the Expo Babel preset required for bundling
        run: npx expo install babel-preset-expo
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Bundle JavaScript for standalone Android APK
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Build standalone installable APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cashup-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
