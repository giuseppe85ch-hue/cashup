name: CASHUP native app validation
concurrency:
  group: cashup-validation-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, cashup-native-steps]
  pull_request:
    branches: [main]
    paths:
      - "App.js"
      - "app.json"
      - "index.js"
      - "package.json"
      - "index.html"
      - "NATIVE_STEPS.md"
      - "games/**"
      - "scripts/**"
      - "sw.js"
      - "globalization.js"
      - ".github/workflows/native-app-check.yml"
jobs:
  expo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate CASHUP Games catalog
        run: node scripts/validate-games.mjs
      - name: Check CASHUP mini-game JavaScript syntax
        run: node --check games/arcade.js
      - name: Check CASHUP cloud progress module syntax
        run: node --input-type=module --check < games/cloud-progress.js
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor

  android-debug:
    needs: expo-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install dependencies
        run: npm install
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Embed JavaScript bundle in standalone debug APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          old = 'debuggableVariants = ["debug"]'
          if old not in s:
              raise SystemExit("Could not find React Native debuggableVariants setting; refusing to build an APK without confirming bundle configuration.")
          p.write_text(s.replace(old, "debuggableVariants = []", 1))
          PY
          grep -n 'debuggableVariants' android/app/build.gradle
      - name: Build standalone installable APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cashup-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
