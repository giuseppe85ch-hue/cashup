name: CASHUP iOS simulator build

on:
  push:
    branches: [build/ios-simulator-package]
  pull_request:
    branches: [main]
    paths:
      - "App.js"
      - "app.json"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "games/**"
      - ".github/workflows/ios-simulator-build.yml"
  workflow_dispatch:

jobs:
  ios-simulator-build:
    name: Compile CASHUP for iPhone simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check Expo dependencies
        run: npx expo install --check
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Compile iOS simulator app without Apple signing
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          SCHEME="$(xcodebuild -list -project "$PROJECT" -json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.project.schemes[0])})')"
          test -n "$SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphonesimulator -configuration Debug -derivedDataPath "$PWD/ios/build" CODE_SIGNING_ALLOWED=NO build
          APP="$(find ios/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/CASHUP-iOS-Simulator.app.zip
      - name: Save iOS simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashup-ios-simulator-app
          path: artifacts/CASHUP-iOS-Simulator.app.zip
          if-no-files-found: error
